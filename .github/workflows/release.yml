name: Release

# v で始まるタグ（例: v0.4.0）を push すると、Windows と macOS でテスト → ビルド → 署名 し、GitHub リリースに添付する
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release --timeout 20m

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/PwVault.App -c Release -r win-x64 --self-contained `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -o publish
          $exe = "PwVault-$version-win-x64.exe"
          Move-Item publish/PwVault.exe $exe
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  $exe" | Out-File -Encoding ascii "$exe.sha256"
          "EXE=$exe" >> $env:GITHUB_ENV

      # アプリの自動更新は、この署名をアプリに埋め込んだ公開鍵で確かめてから入れ替える
      - name: Sign
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: dotnet run tools/sign-release.cs -- '${{ github.ref_name }}' $env:EXE

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: PwVault-*-win-x64.exe*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test --configuration Release --timeout 20m

      - name: Package (Apple Silicon / Intel)
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash tools/package-macos.sh "$version" arm64
          bash tools/package-macos.sh "$version" x64

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: dotnet run tools/sign-release.cs -- "$GITHUB_REF_NAME" PwVault-*-osx-*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: PwVault-*-osx-*.zip*

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: files
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" \
            --title "PwVault $GITHUB_REF_NAME" --generate-notes
